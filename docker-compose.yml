name: ${PROJECT_NAME}

services:
  db:
    image: postgres:18.6-alpine3.23@sha256:8c80c49c67052d82f9aaf4ee1f1881c8926b445a1cc916892934845eb8c24204
    container_name: ${PROJECT_NAME}-db
    labels:
      com.project.service: "database"
      com.project.component: "postgresql"
      com.project.version: "18-alpine3.23"
      com.project.description: "PostgreSQL database"
    read_only: true
    tmpfs:
      - /tmp:size=100m
      - /var/run/postgresql:size=10m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS}"]
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    networks:
      - db_network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "4"
  app:
    image: sonarqube:26.9.0.129388-community@sha256:f9036a4bb5b8910112a9aa27f3d45fb47fc961759db8aad4fa6a76d93042c83c
    container_name: ${PROJECT_NAME}-app
    labels:
      com.project.service: "sonarqube"
      com.project.component: "sonarqube"
      com.project.version: "26-community"
      com.project.description: "SonarQube code quality platform"
    read_only: true
    tmpfs:
      - /tmp:size=100m
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${PROJECT_NAME}-db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
      - sonar_temp:/opt/sonarqube/temp
    ports:
      - "127.0.0.1:${EXPOSE_SONAR}:9000"
    networks:
      - app_network
      - db_network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "4"

volumes:
  postgres_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_temp:

networks:
  db_network:
    internal: true
  app_network:
    internal: false
